<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Hello · 葛政豪</title>
  <style>html { background: #f6f2ea; }</style>
  <script>
    // Compatibility URL: enter the homepage before its welcome animation starts.
    (function () {
      var params = new URLSearchParams(location.search);
      var home = new URL('index.html', location.href);
      var target = home;
      try {
        var requested = new URL(params.get('next') || home.href, location.href);
        if (requested.origin === home.origin &&
            (requested.pathname === home.pathname || requested.pathname === new URL('.', home).pathname)) target = requested;
      } catch (_) {}
      target.searchParams.set('__welcome', params.get('preview') === '1' ? 'preview' : 'show');
      location.replace(target.href);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=index.html" /></noscript>
</head>
<body></body>
</html>
