<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>掌上御膳房</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== 变量 & 重置 ===== */
        :root {
            --bg: #FDF6E3;
            --bg-aside: #2C1A0E;
            --primary: #C0392B;
            --primary-dim: #922b21;
            --gold: #C9A84C;
            --gold-light: #F5E6C0;
            --text: #2C1A0E;
            --text-muted: #8B6340;
            --surface: #FFFDF5;
            --border: #E8D9B8;
            --radius: 12px;
            --shadow: 0 4px 20px rgba(44, 26, 14, .08);
            --aside-w: 220px;
            --nav-h: 64px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Noto Serif SC", "PingFang SC", "Microsoft YaHei", serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ===== 布局骨架 ===== */
        #shell {
            display: flex;
            min-height: 100vh;
        }

        /* ---- 侧边栏（PC） ---- */
        #aside {
            width: var(--aside-w);
            background: var(--bg-aside);
            display: flex;
            flex-direction: column;
            padding: 0;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
            transition: transform .3s ease;
        }

        .aside-brand {
            padding: 28px 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
        }

        .aside-brand h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 3px;
        }

        .aside-brand p {
            font-size: 11px;
            color: rgba(255, 255, 255, .35);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .aside-nav {
            flex: 1;
            padding: 20px 0;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 14px 24px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, .5);
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all .2s;
            text-align: left;
            letter-spacing: 1px;
            border-left: 3px solid transparent;
        }

        .nav-btn .icon {
            font-size: 18px;
        }

        .nav-btn:hover {
            color: rgba(255, 255, 255, .85);
            background: rgba(255, 255, 255, .05);
        }

        .nav-btn.active {
            color: var(--gold);
            background: rgba(201, 168, 76, .1);
            border-left-color: var(--gold);
            font-weight: 600;
        }

        .aside-footer {
            padding: 16px 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, .2);
            border-top: 1px solid rgba(255, 255, 255, .06);
        }

        /* ---- 主内容区 ---- */
        #main {
            margin-left: var(--aside-w);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 18px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .top-bar h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 2px;
        }

        .top-bar-badge {
            font-size: 12px;
            background: var(--gold-light);
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .content-area {
            flex: 1;
            padding: 36px 40px;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
        }

        /* ---- 底部导航（Mobile） ---- */
        #bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--nav-h);
            background: var(--bg-aside);
            justify-content: space-around;
            align-items: center;
            z-index: 200;
            border-top: 1px solid rgba(255, 255, 255, .1);
        }

        .mob-nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, .45);
            font-family: inherit;
            font-size: 10px;
            cursor: pointer;
            padding: 8px 0;
            transition: .2s;
            letter-spacing: .5px;
        }

        .mob-nav-btn .icon {
            font-size: 20px;
        }

        .mob-nav-btn.active {
            color: var(--gold);
        }

        /* ===== 页面切换 ===== */
        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* ===== 通用组件 ===== */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background: var(--primary);
            border-radius: 2px;
        }

        /* 表单元素 */
        .field {
            margin-bottom: 12px;
        }

        .field label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
            letter-spacing: .5px;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            font-family: inherit;
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: border-color .2s;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201, 168, 76, .12);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            letter-spacing: .5px;
            transition: .2s;
        }

        .btn-full {
            width: 100%;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-dim);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-ghost {
            background: var(--gold-light);
            color: var(--text-muted);
            border: 1px solid var(--border);
            font-size: 12px;
            padding: 5px 12px;
        }

        .btn-ghost:hover {
            background: var(--border);
        }

        /* ===== 首页：老虎机 ===== */
        .home-hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        @media (max-width: 640px) {
            .home-hero {
                grid-template-columns: 1fr;
            }
        }

        .slot-wrap {
            grid-column: 1 / -1;
        }

        .slot-machine {
            width: 100%;
            height: 180px;
            background: var(--bg-aside);
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 30px rgba(44, 26, 14, .18);
        }

        .slot-gradient-top,
        .slot-gradient-bot {
            position: absolute;
            left: 0;
            right: 0;
            height: 60px;
            z-index: 5;
            pointer-events: none;
        }

        .slot-gradient-top {
            top: 0;
            background: linear-gradient(to bottom, var(--bg-aside) 30%, transparent);
        }

        .slot-gradient-bot {
            bottom: 0;
            background: linear-gradient(to top, var(--bg-aside) 30%, transparent);
        }

        .center-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gold);
            transform: translateY(-50%);
            z-index: 10;
            box-shadow: 0 0 12px rgba(201, 168, 76, .6);
        }

        .slot-track {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slot-item {
            height: 60px;
            line-height: 60px;
            font-size: 22px;
            font-weight: 700;
            color: rgba(255, 255, 255, .85);
            letter-spacing: 2px;
        }

        .slot-item.highlight {
            color: var(--gold);
        }

        .pick-controls {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
        }

        .toggle-row label {
            font-size: 13px;
            color: var(--text-muted);
        }

        .switch {
            position: relative;
            width: 40px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #ddd;
            border-radius: 22px;
            cursor: pointer;
            transition: .3s;
        }

        .slider::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            left: 3px;
            top: 3px;
            transition: .3s;
        }

        .switch input:checked+.slider {
            background: var(--gold);
        }

        .switch input:checked+.slider::before {
            transform: translateX(18px);
        }

        #pick-btn {
            padding: 14px;
            font-size: 16px;
            letter-spacing: 3px;
            border-radius: 10px;
        }

        /* ===== 名录库 ===== */
        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tag-label {
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            transition: .2s;
            letter-spacing: .5px;
        }

        .tag-label.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .food-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .food-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 0;
            border-bottom: 1px dashed var(--border);
        }

        .food-card:last-child {
            border-bottom: none;
        }

        .food-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .tag-badge {
            font-size: 10px;
            background: var(--gold-light);
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .food-tags {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        /* ===== 排期 ===== */
        .sch-date {
            font-weight: 700;
            color: var(--primary);
            font-size: 13px;
            margin-bottom: 3px;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 500px) {
            .schedule-grid {
                grid-template-columns: 1fr;
            }
        }

        .sch-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sch-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* ===== AI 御厨 样式 ===== */
        .ai-chat-area {
            display: flex;
            flex-direction: column;
            height: 60vh;
            min-height: 400px;
        }

        .ai-messages {
            flex: 1;
            overflow-y: auto;
            padding-right: 6px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .ai-msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
        }

        .ai-msg.user {
            align-self: flex-end;
            background: var(--gold-light);
            border: 1px solid var(--border);
            color: var(--text);
            border-bottom-right-radius: 4px;
        }

        .ai-msg.ai {
            align-self: flex-start;
            background: var(--bg-aside);
            color: rgba(255, 255, 255, .9);
            border-bottom-left-radius: 4px;
        }

        .ai-msg .msg-label {
            font-size: 10px;
            letter-spacing: 1px;
            opacity: 0.7;
            margin-bottom: 6px;
        }

        .ai-input-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }

        .ai-input-row input {
            flex: 1;
        }

        .ai-input-row .btn {
            white-space: nowrap;
            padding: 10px 24px;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 14px;
            opacity: .7;
        }

        .empty-state .icon {
            font-size: 36px;
            display: block;
            margin-bottom: 10px;
        }

        /* ===== 响应式：移动端 ===== */
        @media (max-width: 768px) {
            #aside {
                display: none;
            }

            #main {
                margin-left: 0;
            }

            .top-bar {
                padding: 14px 16px;
            }

            .content-area {
                padding: 20px 16px 80px;
            }

            #bottom-nav {
                display: flex;
                flex-wrap: wrap;
            }

            .ai-chat-area {
                height: 50vh;
                min-height: 320px;
            }
        }
    </style>
</head>
<body>

    <div id="shell">
        <!-- 侧边栏（PC） -->
        <aside id="aside">
            <div class="aside-brand">
                <h1>掌上御膳房</h1>
                <p>Imperial Kitchen · 膳食管理</p>
            </div>
            <nav class="aside-nav">
                <button class="nav-btn active" onclick="switchTab('home', this)" data-tab="home">
                    <span class="icon">🎲</span> 翻牌传膳
                </button>
                <button class="nav-btn" onclick="switchTab('library', this)" data-tab="library">
                    <span class="icon">📚</span> 御膳名录
                </button>
                <button class="nav-btn" onclick="switchTab('calendar', this)" data-tab="calendar">
                    <span class="icon">🗓️</span> 历法局排期
                </button>
                <button class="nav-btn" onclick="switchTab('ai', this)" data-tab="ai">
                    <span class="icon">🧑‍🍳</span> AI 御厨
                </button>
            </nav>
            <div class="aside-footer">© 掌上御膳房 · 钦定版</div>
        </aside>

        <!-- 主内容区 -->
        <div id="main">
            <div class="top-bar">
                <h2 id="page-title">今日御膳吃点啥？</h2>
                <span class="top-bar-badge" id="top-badge">翻牌传膳</span>
            </div>

            <div class="content-area">

                <!-- 首页 -->
                <div id="tab-home" class="page active">
                    <div class="card">
                        <div class="slot-machine">
                            <div class="slot-gradient-top"></div>
                            <div class="center-line"></div>
                            <div class="slot-gradient-bot"></div>
                            <div class="slot-track" id="slot-track"></div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">传膳偏好与操作</div>
                        <div class="pick-controls">
                            <div class="toggle-row">
                                <label for="fitness-checkbox">🥩 高蛋白加权模式</label>
                                <label class="switch">
                                    <input type="checkbox" id="fitness-checkbox">
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <button id="pick-btn" class="btn btn-primary btn-full" onclick="pickFood()">传 膳！</button>
                        </div>
                    </div>
                </div>

                <!-- 名录库 -->
                <div id="tab-library" class="page">
                    <div class="card">
                        <div class="card-title">录入新御膳</div>
                        <div class="field">
                            <label>菜名</label>
                            <input type="text" id="food-input-name" placeholder="如：红烧肉、清蒸鱼…">
                        </div>
                        <div class="field">
                            <label>营养标签（至少选一）</label>
                            <div class="tag-group" id="tag-container"></div>
                        </div>
                        <button class="btn btn-primary btn-full" onclick="addNewFood()">存入名录</button>
                    </div>

                    <div class="card">
                        <div class="card-title" id="library-count">御膳全录</div>
                        <div class="food-list" id="library-list"></div>
                    </div>
                </div>

                <!-- 排期 -->
                <div id="tab-calendar" class="page">
                    <div class="card">
                        <div class="card-title">钦定御膳排期</div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                            <div class="field">
                                <label>吉日</label>
                                <input type="date" id="schedule-date">
                            </div>
                            <div class="field">
                                <label>今日御膳</label>
                                <select id="schedule-select">
                                    <option value="">选择菜品</option>
                                </select>
                            </div>
                        </div>
                        <button class="btn btn-primary btn-full" onclick="saveSchedule()">钦定排期</button>
                    </div>

                    <div class="card">
                        <div class="card-title">近期排期一览</div>
                        <div class="schedule-grid" id="schedule-list"></div>
                    </div>
                </div>

                <!-- AI 御厨 -->
                <div id="tab-ai" class="page">
                    <div class="card" style="padding:16px 24px;">
                        <div class="ai-chat-area">
                            <div class="ai-messages" id="ai-messages">
                                <div class="ai-msg ai">
                                    <div class="msg-label">🧑‍🍳 AI 御厨</div>
                                    陛下万福。臣乃御前膳食智囊，精通热量计算、营养分析、体质调养。请尽管下问。
                                </div>
                            </div>
                            <div class="ai-input-row">
                                <input type="text" id="ai-input" placeholder="询问菜肴热量、营养搭配…" onkeydown="if(event.key==='Enter') sendAiMessage()">
                                <button class="btn btn-primary" onclick="sendAiMessage()">呈奏</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div><!-- /content-area -->
        </div><!-- /main -->
    </div><!-- /shell -->

    <!-- 底部导航（Mobile） -->
    <div id="bottom-nav">
        <button class="mob-nav-btn active" onclick="switchTab('home', this)" data-tab="home">
            <span class="icon">🎲</span>翻牌
        </button>
        <button class="mob-nav-btn" onclick="switchTab('library', this)" data-tab="library">
            <span class="icon">📚</span>名录
        </button>
        <button class="mob-nav-btn" onclick="switchTab('calendar', this)" data-tab="calendar">
            <span class="icon">🗓️</span>排期
        </button>
        <button class="mob-nav-btn" onclick="switchTab('ai', this)" data-tab="ai">
            <span class="icon">🧑‍🍳</span>AI御厨
        </button>
    </div>

    <script>
        // ===== 数据 =====
        const defaultFoods = [
            { name: '宫保鸡丁', tags: ['高蛋白', '高脂肪'], weight: 1 },
            { name: '清炒西兰花', tags: ['低卡', '素食'], weight: 1 },
            { name: '番茄炒蛋', tags: ['高蛋白', '低卡'], weight: 1 },
        ];
        const availableTags = ['高蛋白', '高脂肪', '高碳水', '低卡', '素食'];
        const tabTitles = {
            home: ['今日御膳吃点啥？', '翻牌传膳'],
            library: ['御膳名录管理', '御膳名录'],
            calendar: ['历法局排期', '历法局排期'],
            ai: ['AI 御厨问膳', 'AI 御厨']
        };

        let foodLibrary = JSON.parse(localStorage.getItem('myFoodLibrary')) || defaultFoods;
        let scheduleMap = JSON.parse(localStorage.getItem('mySchedule')) || {};
        let selectedTags = new Set();
        let isRunning = false;
        let aiLoading = false;

        // AI API 配置 (第三方聚合)
        const AI_API_URL = 'https://api.airforce/v1/chat/completions';
        const AI_API_KEY = 'sk-air-hP4MXxeWkC0RfyhGMsNlw9oS7p7eotFuKUM9NANSNT4EkxxGXn6FrG8yzFkrCY5L';
        const AI_MODEL = 'kimi-k2.5';   // 已切换为 kimi-k2.5

        // ===== 初始化 =====
        window.onload = () => {
            renderTags();
            renderLibrary();
            renderSchedules();
            renderSelectOptions();
            setupSlotMachine();
            document.getElementById('schedule-date').value = new Date().toISOString().slice(0, 10);
        };

        // ===== 导航 =====
        function switchTab(tabId, el) {
            if (isRunning) return;
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn, .mob-nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            document.querySelectorAll(`[data-tab="${tabId}"]`).forEach(b => b.classList.add('active'));
            document.getElementById('page-title').textContent = tabTitles[tabId][0];
            document.getElementById('top-badge').textContent = tabTitles[tabId][1];
            if (tabId === 'home') setupSlotMachine();
            if (tabId === 'ai') {
                const container = document.getElementById('ai-messages');
                setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
            }
        }

        // ===== 名录 =====
        function renderTags() {
            document.getElementById('tag-container').innerHTML = availableTags.map(tag =>
                `<div class="tag-label" onclick="toggleTag(this,'${tag}')">${tag}</div>`
            ).join('');
        }

        function toggleTag(el, tag) {
            selectedTags.has(tag) ? (selectedTags.delete(tag), el.classList.remove('active')) :
                (selectedTags.add(tag), el.classList.add('active'));
        }

        function addNewFood() {
            const nameEl = document.getElementById('food-input-name');
            const name = nameEl.value.trim();
            if (!name) return alert('请输入菜名');
            if (!selectedTags.size) return alert('请至少选择一个标签');
            foodLibrary.unshift({ name, tags: [...selectedTags], weight: 1 });
            saveData();
            nameEl.value = '';
            selectedTags.clear();
            renderTags();
            renderLibrary();
            renderSelectOptions();
            alert('收录成功！');
        }

        function deleteFood(i) {
            if (confirm('确定要将此菜打入冷宫吗？')) {
                foodLibrary.splice(i, 1);
                saveData();
                renderLibrary();
                renderSelectOptions();
            }
        }

        function renderLibrary() {
            document.getElementById('library-count').innerHTML =
                `<span style="display:flex;align-items:center;gap:8px">御膳全录 <span style="font-size:12px;font-weight:400;color:var(--text-muted)">${foodLibrary.length} 道</span></span>`;
            const list = document.getElementById('library-list');
            if (!foodLibrary.length) {
                list.innerHTML = `<div class="empty-state"><span class="icon">🍽️</span>暂无收录，请先录入御膳</div>`;
                return;
            }
            list.innerHTML = foodLibrary.map((food, i) => `
            <div class="food-card">
                <div>
                    <div class="food-name">${food.name}</div>
                    <div class="food-tags">${food.tags.map(t => `<span class="tag-badge">${t}</span>`).join('')}</div>
                </div>
                <button class="btn btn-ghost" onclick="deleteFood(${i})">撤销</button>
            </div>`
            ).join('');
        }

        // ===== 排期 =====
        function renderSelectOptions() {
            document.getElementById('schedule-select').innerHTML =
                '<option value="">选择菜品</option>' +
                foodLibrary.map(f => `<option value="${f.name}">${f.name}</option>`).join('');
        }

        function saveSchedule() {
            const date = document.getElementById('schedule-date').value;
            const food = document.getElementById('schedule-select').value;
            if (!date || !food) return alert('请选择吉日与御膳');
            scheduleMap[date] = food;
            saveData();
            renderSchedules();
            alert('排期成功！');
        }

        function deleteSchedule(date) {
            if (confirm(`确定撤销 ${date} 的排期吗？`)) {
                delete scheduleMap[date];
                saveData();
                renderSchedules();
            }
        }

        function renderSchedules() {
            const list = document.getElementById('schedule-list');
            const dates = Object.keys(scheduleMap).sort();
            if (!dates.length) {
                list.innerHTML =
                    `<div class="empty-state" style="grid-column:1/-1"><span class="icon">📅</span>暂无排期，赶紧钦定吧</div>`;
                return;
            }
            list.innerHTML = dates.map(d => `
            <div class="sch-card">
                <div class="sch-card-top">
                    <div class="sch-date">${d}</div>
                    <button class="btn btn-ghost" onclick="deleteSchedule('${d}')">撤销</button>
                </div>
                <div class="food-name" style="font-size:15px">${scheduleMap[d]}</div>
            </div>`
            ).join('');
        }

        function saveData() {
            localStorage.setItem('myFoodLibrary', JSON.stringify(foodLibrary));
            localStorage.setItem('mySchedule', JSON.stringify(scheduleMap));
        }

        // ===== 老虎机 =====
        function setupSlotMachine() {
            const track = document.getElementById('slot-track');
            if (!foodLibrary.length) {
                track.innerHTML = '<div class="slot-item" style="color:rgba(255,255,255,.4)">暂无御膳</div>';
                return;
            }
            const list = [...foodLibrary, ...foodLibrary, ...foodLibrary, ...foodLibrary, ...foodLibrary];
            track.innerHTML = list.map(f => `<div class="slot-item">${f.name}</div>`).join('');
            track.style.transition = 'none';
            track.style.transform = 'translateY(60px)';
        }

        function pickFood() {
            if (isRunning || !foodLibrary.length) {
                if (!foodLibrary.length) alert('名录太空啦，请先录入！');
                return;
            }
            const isFitness = document.getElementById('fitness-checkbox').checked;
            const btn = document.getElementById('pick-btn');
            const track = document.getElementById('slot-track');

            let totalW = 0;
            const weights = foodLibrary.map(item => {
                let w = item.weight || 1;
                if (isFitness && item.tags.includes('高蛋白')) w = 5;
                totalW += w;
                return w;
            });

            let R = Math.random() * totalW,
                sum = 0,
                targetIdx = 0;
            for (let i = 0; i < foodLibrary.length; i++) {
                sum += weights[i];
                if (R <= sum) { targetIdx = i; break; }
            }

            isRunning = true;
            btn.textContent = '御厨翻锅中…';
            btn.disabled = true;

            track.style.transition = 'none';
            track.style.transform = 'translateY(60px)';

            setTimeout(() => {
                const finalIdx = targetIdx + foodLibrary.length * 3;
                track.style.transition = 'transform 3s cubic-bezier(0.25, 1, 0.25, 1)';
                track.style.transform = `translateY(${60 - finalIdx * 60}px)`;

                setTimeout(() => {
                    isRunning = false;
                    btn.textContent = '传 膳！';
                    btn.disabled = false;
                    alert(`🎊 圣旨到：今日御膳赐【 ${foodLibrary[targetIdx].name} 】`);
                }, 3000);
            }, 50);
        }

        // ===== AI 御厨 =====
        function sendAiMessage() {
            if (aiLoading) return;
            const inputEl = document.getElementById('ai-input');
            const question = inputEl.value.trim();
            if (!question) return;
            inputEl.value = '';
            appendMessage('user', question);
            aiLoading = true;
            fetchAiResponse(question);
        }

        function appendMessage(role, text) {
            const container = document.getElementById('ai-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `ai-msg ${role}`;
            if (role === 'ai') {
                msgDiv.innerHTML = `<div class="msg-label">🧑‍🍳 AI 御厨</div>${text.replace(/\n/g, '<br>')}`;
            } else {
                msgDiv.innerHTML = `<div class="msg-label">陛下</div>${text.replace(/\n/g, '<br>')}`;
            }
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        async function fetchAiResponse(userMessage) {
            const container = document.getElementById('ai-messages');
            const tempDiv = document.createElement('div');
            tempDiv.className = 'ai-msg ai';
            tempDiv.innerHTML = '<div class="msg-label">🧑‍🍳 AI 御厨</div>臣正在思索中…';
            container.appendChild(tempDiv);
            container.scrollTop = container.scrollHeight;

            const systemPrompt = `你是掌上御膳房的AI御厨，专门为皇上提供膳食咨询。你精通：
- 各类菜品的详细热量（千卡/份）、蛋白质、脂肪、碳水化合物含量；
- 营养学知识，能分析膳食平衡、体质调养；
- 中国传统养生文化，可结合时令、体质推荐御膳。
请用半文半白、恭敬但略带风趣的语气回答，每次回答控制在200字以内，结尾加一个相关建议或小贴士。若用户问及未收录的菜品，可据常识估计。`;

            const messages = [
                { role: 'system', content: systemPrompt },
                { role: 'user', content: userMessage }
            ];

            try {
                const response = await fetch(AI_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${AI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: AI_MODEL,   // 使用 kimi-k2.5 模型
                        messages: messages,
                        temperature: 0.8,
                        max_tokens: 400
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`API错误 ${response.status}: ${errText}`);
                }

                const data = await response.json();
                const reply = data.choices?.[0]?.message?.content || '（臣一时语塞，请陛下再问一次）';

                tempDiv.innerHTML =
                    `<div class="msg-label">🧑‍🍳 AI 御厨</div>${reply.replace(/\n/g, '<br>')}`;
            } catch (error) {
                console.error(error);
                tempDiv.innerHTML =
                    `<div class="msg-label">🧑‍🍳 AI 御厨</div>臣罪该万死，与御膳房的联络中断了…（${error.message}）`;
            } finally {
                aiLoading = false;
                container.scrollTop = container.scrollHeight;
            }
        }
    </script>
</body>
</html>
